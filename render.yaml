services:
  - type: web
    name: shoply
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build:prod
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: KHQRPAY_PROFILE_ID
        sync: false
      - key: KHQRPAY_SECRET_KEY
        sync: false
