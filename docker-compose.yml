version: '3.8'

services:
  shoply:
    build: .
    container_name: shoply-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=file:./dev.db
    volumes:
      - ./server/prisma:/app/server/prisma
      - ./server/uploads:/app/server/uploads
    env_file:
      - ./server/.env
